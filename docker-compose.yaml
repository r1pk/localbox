name: localbox

services:
    nginx:
        image: nginx:alpine
        ports:
            - "${DOCKER_HOST_PORT:-8000}:80"
        volumes:
            - "./docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro"
            - "./:/var/www/localbox"
        depends_on:
            - php

    php:
        build:
            context: .
            dockerfile: ./docker/php/Dockerfile
        user: www-data
        volumes:
            - "./docker/php/conf.d/default.ini:/usr/local/etc/php/conf.d/default.ini:ro"
            - "./storage:/var/www/storage"
            - "./:/var/www/localbox"
        extra_hosts:
            - "host.docker.internal:host-gateway"
